[package]
name = "rgb-settlement-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[workspace]

[dependencies]
rgb-lib = { git = "https://github.com/RGB-Tools/rgb-lib", rev = "1eaf0024c591e41843eb80cc8834082292668871" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rgb-psbt-utils = "=0.11.1-rc.11"
base64 = "0.22.1"

[patch."https://github.com/RGB-Tools/rgb-lib"]
rgb-lib = { path = "vendor/rgb-lib" }

[profile.release]
overflow-checks = true
