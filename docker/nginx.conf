worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $arg_cursor $history_query {
        "" "";
        "~^[a-zA-Z0-9_-]{1,300}$" "?cursor=$arg_cursor";
        default invalid;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control no-store always;
        resolver 127.0.0.11 valid=10s;
        set $market http://runtime:4100;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host runtime:4100;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        location = /market-api/health {
            if ($request_method != GET) { return 405; }
            proxy_pass $market/health;
        }
        location = /market-api/orders {
            if ($request_method != GET) { return 405; }
            proxy_pass $market/orders;
        }
        location = /market-api/activity {
            if ($request_method != GET) { return 405; }
            proxy_pass $market/activity;
        }
        location = /market-api/history {
            if ($request_method != GET) { return 405; }
            if ($history_query = invalid) { return 400; }
            proxy_pass $market/history$history_query;
        }
        location /market-api { return 404; }
        location = /health { default_type text/plain; return 200 "ok\n"; }
        location /assets/ { try_files $uri =404; }
        location /hero/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
